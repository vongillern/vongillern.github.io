<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found · Jon von Gillern</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0B0C0E">
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/fonts/fonts.css">
  <style>
    :root { --bg: #0B0C0E; --text: #E8EAED; --muted: #8A9099; --dim: #5E646D; --lime: #C8FF4D; --line: #22262C; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { font: 400 17px/1.55 "Geist", system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; padding: 24px; }
    main { width: min(720px, 100%); border-top: 1px solid var(--line); padding-top: 18px; }
    .label { font: 400 11px/1.4 "Geist Mono", ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); display: flex; justify-content: space-between; }
    h1 { font-weight: 500; font-size: clamp(44px, 9vw, 96px); letter-spacing: -.045em; line-height: .98; margin: 48px 0 16px; }
    h1 span { color: var(--lime); }
    p { color: var(--muted); margin: 0 0 32px; max-width: 42ch; }
    a { font-family: "Geist Mono", ui-monospace, monospace; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--lime); padding-bottom: 2px; }
    a:hover, a:focus-visible { color: var(--lime); outline: none; }
  </style>
</head>
<body>
  <main>
    <div class="label"><span>Error 404</span><span>Signal lost</span></div>
    <h1>Nothing measured <span>here.</span></h1>
    <p>This page does not exist. It may have moved, or the link may be wrong.</p>
    <a href="/">&gt; Go to the homepage</a>
  </main>
</body>
</html>
